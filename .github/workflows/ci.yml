name: ci

# The deterministic core is 2,115 assertions and nothing was running them on
# push. Every suite is pure — no network, no clock, no device, no Electron — so
# the whole thing runs on a plain Node runner in seconds and needs no services.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # src/config.js holds real credentials and is gitignored, but
      # toolService.js imports it at module load, so two suites cannot even be
      # imported on a fresh clone. The committed template has the same shape
      # with placeholder values. This is what a new contributor does by hand;
      # doing it here means the suite runs on a clean checkout, which is the
      # only way this workflow tests what it claims to.
      - name: Seed the placeholder config
        run: cp src/config.example.js src/config.js

      # The suites do reach node_modules: routing.test.mjs imports jarvis.js,
      # which pulls in toolService.js and @google/genai. dat.gui and three
      # arrive the same way. All three are runtime dependencies, so --omit=dev
      # installs everything the tests touch while skipping Electron, a ~100MB
      # download that nothing under test uses.
      #
      # `npm install`, not `npm ci`. KNOWN DEFECT: package-lock.json is out of
      # sync with package.json on Linux — it is missing the platform-gated
      # electron-builder packages (electron-builder-squirrel-windows,
      # electron-winstaller and their trees), so `npm ci` refuses with EUSAGE.
      # Windows npm reports the same lockfile as up to date, which is why this
      # went unnoticed: it breaks `npm ci` for every contributor not on
      # Windows. Regenerating it needs a clean checkout on Linux; doing it from
      # Windows dropped ~3,700 lines of the dev tree and would have broken
      # `npm run electron`. Left as a deliberate follow-up rather than a
      # blind rewrite of a lockfile.
      - name: Install runtime dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Run the deterministic suite
        run: node scripts/run-tests.mjs

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      # The scaffolding this app came from pulls in expo and react-native
      # alongside React 19, and their peer ranges genuinely conflict. Vercel
      # builds it fine because its installer is not strict about peers; npm ci
      # is, so it needs to be told. Nothing here imports react-native — it is
      # unused scaffolding, and removing it is the real fix.
      - name: Install
        run: npm ci --legacy-peer-deps

      # Typecheck only. The Next build is what Vercel already runs on every
      # push, so repeating it here would buy nothing but minutes.
      - name: Typecheck
        run: npx tsc --noEmit

  # Packaging is where this repo has actually broken before: the old inline
  # build config listed only [dist, electron.js, preload.js], while electron.js
  # requires eleven sibling modules and spawns two Python servers. Every unit
  # test passed and the installed app died on its first require. A pure test
  # suite cannot catch that, so the package is built and launched here.
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Seed the placeholder config
        shell: bash
        run: cp src/config.example.js src/config.js

      # `npm install`, not `npm ci`. package-lock.json is out of sync with
      # package.json on Linux — it is missing the platform-gated
      # electron-builder packages — so `npm ci` refuses with EUSAGE there while
      # Windows reports the same lockfile as fine. Documented in the test job
      # above; the same defect blocks this job, and a build needs devDeps.
      - name: Install
        run: npm install --no-audit --no-fund

      # @napi-rs/canvas (via pdf-to-img) declares 11 platform variants as
      # optionalDependencies and npm installs only the host's. electron-builder
      # walks the declared list and dies on the first absent directory.
      - name: Stub absent platform packages
        run: node scripts/prepare-native-deps.mjs

      # Both icon sets come from the same artwork. The favicons are committed,
      # so this also fails CI if someone edits the source without regenerating.
      - name: Generate icons
        run: npm run icons

      # Unsigned on purpose. A pull request from a fork has no certificate, and
      # build validation must not depend on one.
      - name: Build (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      # Electron needs a display server; the other two runners have a session.
      - name: Smoke test (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run --auto-servernum node scripts/smoke-test.mjs

      - name: Smoke test
        if: matrix.os != 'ubuntu-latest'
        run: node scripts/smoke-test.mjs

      - name: Checksums
        run: npm run checksums && npm run checksums:verify

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/latest*.yml
            release/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
